title: Gauzeder
description: A starter template for a Jeykll site using the Just the Docs theme!
theme: just-the-docs

url: https://ibanfr.github.io/gauzeder

aux_links:
  Gauzeder on Github: https://github.com/ibanfr/gauzeder

# Makes Aux links open in a new tab. Default is false
aux_links_new_tab: true

callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red